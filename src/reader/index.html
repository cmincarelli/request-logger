<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logger — API explorer</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>Logger</h1>
      <div class="controls">
        <label>session
          <select id="session"></select>
        </label>
        <label>filter
          <input id="filter" type="search" placeholder="host / status / method" />
        </label>
        <label><input id="live" type="checkbox" checked /> live</label>
        <button id="catalogue-btn">catalogue</button>
        <button id="auth-btn">auth</button>
      </div>
    </header>
    <main>
      <section id="endpoints" class="pane">
        <h2>Endpoints <span id="endpoint-count"></span></h2>
        <div id="endpoint-list"></div>
      </section>
      <section id="timeline" class="pane">
        <h2>Timeline <span id="event-count"></span></h2>
        <div id="event-list"></div>
      </section>
      <section id="inspector" class="pane">
        <h2>Inspector</h2>
        <div id="inspector-body"><p class="hint">select an event</p></div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
