<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logger — API explorer</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>Logger</h1>
      <div class="controls">
        <label>session
          <select id="session"></select>
        </label>
        <label><input id="live" type="checkbox" checked /> live</label>
        <label><input id="show-assets" type="checkbox" /> assets</label>
        <button id="export-btn" title="download the current session as a .jsonl file">export</button>
        <button id="new-session-btn" title="start a fresh capture session (keeps the old log file)">new session</button>
        <label class="import-label">import
          <input id="import-file" type="file" accept=".jsonl,application/x-ndjson,text/plain" hidden />
        </label>
      </div>
    </header>
    <main>
      <section id="pages" class="pane">
        <h2>Pages <span id="page-count"></span> <button id="collapse-all-btn" class="mini-btn" title="collapse/expand all page groups">collapse all</button></h2>
        <div id="filter-bar" class="filter-bar">
          <span class="filter-label">show:</span>
          <button class="chip" data-f="GET">GET</button>
          <button class="chip" data-f="POST">POST</button>
          <button class="chip" data-f="PUT">PUT</button>
          <button class="chip" data-f="DELETE">DELETE</button>
          <button class="chip" data-f="PATCH">PATCH</button>
          <button class="chip" data-f="WS">WS</button>
          <button class="chip" data-f="UI">UI</button>
          <button class="chip chip-clear" data-f="" title="clear filters">all</button>
        </div>
        <div id="page-list"></div>
      </section>
      <div class="divider" id="divider-1" title="drag to resize"></div>
      <section id="inspector" class="pane">
        <h2>Inspector</h2>
        <div id="inspector-body"><p class="hint">select a request to inspect</p></div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
